/* ── ① Model Health ───────────────────────────────────── */
/* 这一部分只回答一个问题：四条整体指标现在各是多少。
   值全部读载荷，页面只印不算。
   原来这里还有一条状态横幅 + 一条可点开的 P0/P1 待办名单（2026-10-12 撤掉，
   2026-10-13 连「状态」这个概念一起从页面上退场）：判定那几档要重新解释一遍
   阈值（P0 待办、数据源逾期、指标越线），而那几样东西 ② 里各自带着规则和证据
   列着，① 再判一次就是在页面上放第二份判据——改了一边立刻对不上。 */
sec('modelHealth', () => {
  const M = DATA.metrics || {};

  /* 全局规则的命中 / 恢复 / 判不了，按载荷里的 tile 贴到对应指标卡上。
     2026-10-14 的「全局规则命中」块和 10-16 的重挂都撤了——整体指标命中不该另开一块；
     角标挂在读数旁边，规则 ID + 连续天数，不再解释一遍判据（判据在规则表里）。
     类别规则没有 tile，仍只进 ② 各自类别块。 */
  const GTILE = new Map();
  const gput = (tile, state, text) => {
    if (!tile) return;
    if (!GTILE.has(tile)) GTILE.set(tile, []);
    GTILE.get(tile).push({ state, text });
  };
  (DATA.todo.items || []).forEach(it => {
    if (it.scope !== 'global') return;
    const d = it.consecutiveDays;
    gput(it.tile, 'hit', `${it.ruleId} · ${d
      ? L(`连续 ${d} 天`, `${d} consecutive day${d > 1 ? 's' : ''}`)
      : L('本期成立', 'holds this period')}`);
  });
  ((DATA.alerts && DATA.alerts.recovered) || []).forEach(r => {
    if (r.tile) gput(r.tile, 'na', `${r.ruleId} · ${L('已恢复', 'recovered')}`);
  });
  ((DATA.alerts && DATA.alerts.insufficient) || []).forEach(r => {
    if (r.tile) gput(r.tile, 'na', `${r.ruleId} · ${L('判不了', 'cannot tell')}`);
  });

  // 六张卡 = 「整体现在怎么样」的六个数。值、分子、分母全部读载荷，页面只印不算——
  // 口径在脚本里定死一处，JS 里再算一遍迟早会和 ② 那几条线分叉。
  // 圆点只在趋势图里真有这条线时才挂：全局一致率没有图，硬配个颜色等于宣称
  // 「图上找得到它」，而它并不在图里。
  // 「一致率」与「全局一致率」的分母不同（并集 / 全量样本），谁也替代不了谁：
  // 前者回答「模型开口的那些里猜对了多少」，后者回答「全部交易里猜对了多少」，
  // 中间差的那块正是双方都没分类的样本。所以两张卡各自印着自己的分子分母。
  // 漏识别率与多识别率是 2026-10-14 补的：它们与一致率互补（差的那一段还有
  // 「分类不一致」），单独摆出来是因为这两类差异的排查方向完全不同——
  // 一个要补规则，一个要收规则。
  const TILES = [
    { k: L('illion 覆盖率', 'Illion coverage'), m: 'illion_coverage',  c: 'var(--s-illion)' },
    { k: L('bscat 覆盖率', 'BSCAT coverage'),  m: 'bscat_coverage',   c: 'var(--s-finv)' },
    { k: L('一致率（并集口径）', 'Agreement (union)'),   m: 'agreement',        c: 'var(--s-agree)' },
    { k: L('全局一致率（全量样本）', 'Global agreement (all rows)'), m: 'global_agreement', c: null },
    // 漏识别 / 多识别：与 ② 里两条率线同一个口径（÷ 并集），颜色也取自差异类型的
    // 固定配色（见 NT），两处说的是同一件事。这两个率都不含「分类不一致」那一段。
    { k: L('漏识别率（并集口径）', 'Miss rate (union)'),  m: 'miss',  c: 'var(--m-miss)' },
    { k: L('多识别率（并集口径）', 'Extra rate (union)'), m: 'extra', c: 'var(--m-extra)' },
  ];
  el('mhTiles').innerHTML = TILES.map(t => {
    const d = M[t.m] || {};
    const v = d.value;
    // 取不到就写「—」。写 0.00% 会被读成「测到了，是零」，那是另一件事。
    const val = (v == null || !isFinite(v))
      ? '<div class="tn na">—</div>'
      : `<div class="tn">${(v * 100).toFixed(2)}<em>%</em></div>`;
    const basis = (d.num == null || d.den == null) ? ''
      : `<div class="tb">${i(d.num)} ÷ ${i(d.den)}</div>`;
    const badges = GTILE.get(t.m) || [];
    const hits = badges.map(x =>
      `<div class="tbadge ${x.state}">${esc(x.text)}</div>`).join('');
    // 红框只属于「命中」；已恢复 / 判不了也挂角标（灰底），但不该把整张卡染红。
    const hasHit = badges.some(x => x.state === 'hit');
    return `<div class="tile${hasHit ? ' hit' : ''}">
      <div class="tl">${t.c ? `<span class="dot" style="background:${t.c}"></span>` : ''}${esc(t.k)}</div>
      ${val}${basis}${hits}
    </div>`;
  }).join('');
});

/* ── ① 附：指标趋势 ───────────────────────────────────── */
/* 一天一期，横轴就是监控日期。三张图各自成图、各自带日期轴——这是小多组，不是双轴：
   覆盖率与一致率量级接近（88 / 90 / 78 附近），差异那一组只有它们的几分之一，
   硬塞进同一个轴会被压成几条直线，而模型变化恰恰藏在那几条线上。
   横轴就是这一屏的全部历史（见上面那段「日期轴只有一条」）；图、悬浮提示、数据表
   读的是同一份切片，三处不会各说各话。 */
/* 类别名 → ② 里那一块的锚点。② 的左侧目录点一条要跳过去，而锚点由 ② 生成；
   两处读写同一张表，就不用把 DOM 查询写成 `[data-cat="..."]` 那种拼字符串的
   选择器——类别名里有空格也有连字符，拼进选择器迟早出事。
   锚点按 rows 的下标编号（cat-${n}），与块的先后无关：排序搬的是节点，
   编号不动，所以重排之后跳转照样落在正确的块上。 */
const CAT_ANCHOR = new Map();
function jumpToCat(name) {
  const id = CAT_ANCHOR.get(name);
  const node = id && document.getElementById(id);
  if (!node) return;
  node.scrollIntoView({ behavior: 'smooth', block: 'start' });
  node.classList.add('flash');
  setTimeout(() => node.classList.remove('flash'), 1900);
}

/* ── ① 整体指标趋势 ─────────────────────────────────────
   三组指标各一张图，共用同一条日期轴：这一屏的监控日期，以及它往前能查到的
   全部历史（见上面那段「日期轴只有一条」）。覆盖率与一致率都是百分比，但一个
   常在 60–100%、一个能掉到 0，合用一根轴会把后者的波动压平，所以分开画，
   纵轴各自独立。

   差异笔数与差异金额合成了一张双轴图（用户 2026-10-10 定）：两个量纲本来就
   不能共用一根轴，但它们是同一件事的两面，上下两张图各占半屏、滚一次才能对照，
   不如摆在一起。代价是两条线的高低、交点都取决于各自量程怎么缩——所以两个
   刻度各标各的（左边笔数、右边金额，刻度色与线同色）；提醒「谁在上面不构成
   结论」那句原来在图标题的悬停里，2026-10-16 删掉了，读的人看的是各自的走势。

   「整体一致率」这一组有两条线。口径同页并存，名字必须分得开：
     一致率（并集口径）   = 标签相同 ÷ 双方至少一侧有分类   ← 趋势表里直接有这一列
     全局一致率（全量样本）= 标签相同 ÷ 全量样本（含双方都没分类的）
   还有第三个分母（双方都给出了分类）不再画出来：它夹在上面两条之间，
   分子与它们完全相同，多画一条只是多一个要解释的间距。它仍在数据表里。
   定义与页脚、与 monitor.py 的 build_metrics 逐字一致；页面只是拿趋势行里的
   分子分母现除（趋势表里只存了并集口径那一列），不改任何口径。 */
sec('overallTrend', () => {
  const trows = (DATA.trend || []).filter(r => !DATA.dataDate || r.par_dt <= DATA.dataDate);
  // 图下那句变化摘要为空的时候，得有一句说明它为什么空——否则看起来像坏了。
  // 只有一期历史时就是这种情况：没有上一期，就没有「较上一监控日」这回事。
  // 有历史时不写：那句话自己会说，这里再说一遍是同一件事说两遍。
  el('trendSub').innerHTML = DATA.prevDate ? ''
    : L(`历史只有 <b>${i(trows.length)}</b> 期，还比不出「较上一监控日」的变化——`
        + '这一句要等第二期历史攒下来。',
        `Only <b>${i(trows.length)}</b> period of history — no period-on-period change to compare yet. `
        + 'This line needs a second period to appear.');
  if (!trows.length) {
    el('ovCharts').innerHTML = `<div class="void">${esc(L('还没有历史数据，画不出趋势。',
      'No history yet — there is no trend to draw.'))}</div>`;
    return;
  }

  // 一行趋势 → 一行图数据。这里只做「取列 + 按定义做一次除法」，
  // 不做任何平滑、补齐或换算。
  const mk = r => {
    const ag = r.agreement_num, tot = r.total_rows, both = r.both_class_rows;
    return {
      date: r.par_dt,
      illion_coverage: r.illion_coverage,
      finv_coverage: r.finv_coverage,
      agree_union: r.coverage_adjusted_agreement,
      agree_both: (ag != null && both) ? ag / both : null,
      agree_all: (ag != null && tot) ? ag / tot : null,
      miss_rate: r.miss_rate,
      extra_rate: r.extra_rate,
      all_difference_count: r.all_difference_count,
      mismatch_amount: r.mismatch_amount,
    };
  };

  // 「分类不一致率」源表里没有这一列，但恒等式能减出来：
  // 差异率 = 漏识别率 + 不一致率 + 多识别率（三项分母都是「并集」，可以直接加减）。
  // 三个数缺一个就减不出来，那时返回 null，表格写「—」，不拿别的数顶上。
  const mixRate = r => (r.all_difference_rate != null && r.miss_rate != null && r.extra_rate != null)
    ? Math.max(0, r.all_difference_rate - r.miss_rate - r.extra_rate) : null;

  // 每条线画什么、叫什么、什么颜色，四处（①②的图例 / 端点直标 / 悬停）共用这一份。
  const C_UNION = { key: 'agree_union', name: L('一致率（并集口径）', 'Agreement (union)'),     color: 'var(--s-agree)' };
  const C_ALL   = { key: 'agree_all',   name: L('全局一致率（全量样本）', 'Global agreement (all rows)'), color: 'var(--s-agree)', dash: '2 3' };
  const CELLS = [
    {
      id: 'cov', title: L('Coverage 覆盖率', 'Coverage'), sub: L('两侧各自判出分类的比例', 'share of rows each side classified'),
      unit: 'rate', H: 200, series: [
        { key: 'finv_coverage',   name: L('bscat 覆盖率', 'BSCAT coverage'),  color: 'var(--s-finv)' },
        { key: 'illion_coverage', name: L('illion 覆盖率', 'Illion coverage'), color: 'var(--s-illion)' },
      ],
    },
    {
      id: 'agree', title: L('Agreement 整体一致率', 'Agreement'), sub: L('两个口径并列', 'both denominators side by side'),
      unit: 'rate', H: 200, series: [C_UNION, C_ALL],
    },
    {
      // 漏识别 / 多识别：一致率低下来时先看这一段是哪个方向——两个率都不含
      // 「分类不一致」，所以它们涨、一致率不一定低到哪去；反过来两个率都不高而
      // 一致率很差，问题就在分类不一致上（表里减得出来，见 mixRate）。
      id: 'mix', title: L('Miss / Extra 漏识别与多识别', 'Miss / Extra'), sub: L('并集口径 · 不含分类不一致', 'union denominator · excludes category mismatch'),
      unit: 'rate', H: 200, series: [
        { key: 'miss_rate',  name: L('漏识别率', 'Miss rate'), color: 'var(--m-miss)' },
        { key: 'extra_rate', name: L('多识别率', 'Extra rate'), color: 'var(--m-extra)' },
      ],
    },
    {
      id: 'diff', title: L('Difference 差异笔数与金额', 'Difference count and amount'),
      sub: L('笔数看左轴 · 金额看右轴', 'count on the left axis · amount on the right'),
      unit: 'count', unit2: 'money', H: 240, zero: true,
      series: [{ key: 'all_difference_count', name: L('差异笔数', 'Difference count'), color: 'var(--s-diffc)' }],
      series2: [{ key: 'mismatch_amount', name: L('差异金额', 'Difference amount'), color: 'var(--s-diffa)' }],
    },
  ];

  const swatch = s => `<svg width="18" height="4" style="flex:none" aria-hidden="true">`
    + `<line x1="1" y1="2" x2="17" y2="2" stroke="${s.color}" stroke-width="3" stroke-linecap="round"`
    + (s.dash ? ` stroke-dasharray="${s.dash}"` : '') + `/></svg>`;

  /* 均值虚线的图例样本。颜色是跟着线走的（每条线各一条同色虚线），图例里没法用
     一个色块代表全部，所以这枚用中性墨色，说的只是「虚线 = 均值」这一件事。 */
  const avgLegend = `<span class="it">`
    + `<svg width="18" height="4" style="flex:none" aria-hidden="true">`
    + `<line x1="1" y1="2" x2="17" y2="2" stroke="var(--ink-3)" stroke-width="3" `
    + `stroke-linecap="round" stroke-dasharray="4 4"/></svg>${esc(L('均值', 'average'))}</span>`;

  el('ovCharts').innerHTML = CELLS.map(c => `
    <div class="ovcell">
      <div class="ovhd">
        <span class="ovt">${esc(c.title)}<span class="qc">${esc(c.sub)}</span></span>
        <span class="legend">${c.series.concat(c.series2 || []).map(s =>
          `<span class="it">${swatch(s)}${esc(s.name)}</span>`).join('')}${avgLegend}</span>
      </div>
      <div class="chartwrap" id="wr-${c.id}">
        <svg class="chart" id="sv-${c.id}"></svg>
        <div class="tipbox" id="tp-${c.id}"></div>
      </div>
    </div>`).join('');

  const charts = CELLS.map(c => makeChart({
    svg: el('sv-' + c.id), wrap: el('wr-' + c.id), tip: el('tp-' + c.id),
    // 双轴那张图右边要同时放下两条端点直标和右轴刻度，右边距单独放宽。
    W: 900, H: c.H, M: { t: 12, r: c.series2 ? 132 : 86, b: 30, l: 54 },
    unit: c.unit, unit2: c.unit2, zero: c.zero, series: c.series, series2: c.series2,
  }));
  chartGroup(charts);

  function draw() {
    const rows = trows.map(mk);
    charts.forEach(ch => ch.render(rows));
    // 数据表与折线读的同一份切片（trows 就是画在图上的那几期）。原来这里还有一层
    // 「表跟着图上的范围裁一刀」，范围撤掉之后两边天然一致：横轴画到哪一期，
    // 表里就写到哪一期，都是「这一屏的监控日期往前、历史里查得到的全部」。
    buildTable('trendTv',
      [L('监控日期', 'Monitoring date'), L('总交易', 'All transactions'), L('并集', 'Union'),
       L('双方有分类', 'Both classified'), L('illion 覆盖率', 'Illion coverage'), L('bscat 覆盖率', 'BSCAT coverage'),
       L('一致率(并集)', 'Agreement (union)'), L('一致率(双方有分类)', 'Agreement (both classified)'),
       L('全局一致率', 'Global agreement'),
       L('漏识别率', 'Miss rate'), L('分类不一致率', 'Category mismatch rate'),
       L('多识别率', 'Extra rate'), L('未分类率', 'Unclassified rate'),
       L('差异笔数', 'Difference count'), L('差异率', 'Difference rate'), L('差异金额', 'Difference amount')],
      trows.map(r => {
        const m = mk(r), c = (v, f) => (v == null || !isFinite(v)) ? '—' : f(v);
        return [r.par_dt, i(r.total_rows),
          r.union_rows == null ? '—' : i(r.union_rows),
          r.both_class_rows == null ? '—' : i(r.both_class_rows),
          c(r.illion_coverage, pct), c(r.finv_coverage, pct),
          c(m.agree_union, pct), c(m.agree_both, pct), c(m.agree_all, pct),
          c(r.miss_rate, pct), c(mixRate(r), pct), c(r.extra_rate, pct), c(r.unknown_rate, pct),
          i(r.all_difference_count), c(r.all_difference_rate, pct),
          c(r.mismatch_amount, money)];
      }));
  }
  draw();
});

/* ── ② 变化摘要 ───────────────────────────────────────── */
/* 这里原来是一张七行六列表（指标 / 本期 / 上期 / 变化 / 方向 / 状态）。数字本身
   图里都查得到，而那张表占掉的位置比三张图加起来还高，所以压成图下那一句。

   这一句不是「重排过的七行」，是一条摘要：只点越过变化阈值的那几项，最多三行。
   判据仍只有一份——build_changes 算出来的 worsened，页面不重判、不挑别的标准。
   措辞一律中性（「较上一监控日下降 N pt」）：上一期是上一次运行的那批样本，不是
   同一批样本重跑，这个差不构成「模型变好还是变差」的证据。

   没有上一期就没有变化这回事：这一行留空（CSS 里 :empty 直接不占位），
   由上面 #trendSub 那句「历史只有 N 期」说明，不拿本期数字充当变化。 */
sec('changeLine', () => {
  const rows = DATA.changes || [];
  // 只点名「这期真的往坏方向走满了一个阈值」的指标，判据就是服务端算好的 worsened
  // （见 build_changes）。不按方向筛：方向把「涨了一点」与「涨过了一个阈值」说成
  // 同一件事，印出来的会是「走坏：Coverage 覆盖率上升 1.06 pt」这种自相矛盾的句子。
  const bad = rows.filter(c => c.worsened);
  const line = el('changeLine');
  if (rows.length) {
    if (bad.length) {
      line.className = 'chline bad';
      line.innerHTML = L(`<b>较上一监控日（${esc(DATA.prevDate || '—')}）走坏</b>：`,
                         `<b>Worse than the previous monitoring date (${esc(DATA.prevDate || '—')})</b>: `)
        + bad.slice(0, 3).map(c =>
          L(`${esc(tx(c.label))} ${c.delta > 0 ? '上升' : '下降'} `,
            `${esc(tx(c.label))} ${c.delta > 0 ? 'up' : 'down'} `)
          + `${Math.abs(c.delta * 100).toFixed(2)} pt`).join(' · ')
        + (bad.length > 3 ? L(` 等 <b>${i(bad.length)}</b> 项`, `, ${i(bad.length) - 3} more`) : '');
    } else {
      line.className = 'chline ok';
      line.innerHTML = L(`较上一监控日（${esc(DATA.prevDate || '—')}）`
          + `没有指标越过 <b>${DATA.changeBadPt.toFixed(2)} pt</b> 的变化阈值。`,
        `Versus the previous monitoring date (${esc(DATA.prevDate || '—')}), no metric crossed `
          + `the <b>${DATA.changeBadPt.toFixed(2)} pt</b> change threshold.`);
    }
  }
});

/* ── 类别 → 待办 / 已恢复 / 判不了（② 每块底下那层折叠共用）────
   这三样原来是 ③ 异常预警一整节：一个类别一张卡，规则明细再折在预警条（那时
   叫「触碰的规则」）后面。2026-10-12 并进 ②，索引从「类别名」变成「类别块」——同一个类别的
   「今天有没有事」与「具体是哪几笔」落在同一个折叠里，读的人不必在两处之间对照。

   合并只改「在哪儿读」，不改判据：预警仍然只由规则产生，页面不提供第二种报警的
   方式，也不用「建议关注」把空状态填满。每一条留三行——判据（含本期读数）、
   连续天数、触发日期；证据、对照值、原因、走势图一概不放，同一个折叠里的趋势图
   和明细树上已经有了，再抄一份，两处迟早各说各话。

   处理进度不在这里：原来右边的运维事项栏（状态下拉、三颗按钮、本机 localStorage
   覆盖）2026-10-10 撤掉了。团队看到的进度在 output/todo_status.csv 里，页面不
   复制一份、也不回写它。 */
const TODO_BY_NAME = new Map();      // 类别 → 命中的规则条目，沿用脚本给的顺序，页面不重排
const RECOVERED_BY_NAME = new Map(); // 类别 → 本期已恢复的条目
const INSUFF_BY_NAME = new Map();    // 类别 → 判不了的规则
const ALERTS = DATA.alerts || {};

(DATA.todo.items || []).forEach(it => {
  // 全局规则的命中（scope=global，名字是「全体类别」）不属于任何一类：它没有对应的
  // 类别块，摊到 36 类里说 36 遍也不成话。2026-10-20 起它由 ① 指标卡的角标展示
  // （见 sec('modelHealth')），这里仍然跳过，别把「全体类别」当成一个类别塞进
  // 下面三处按类别组织的结构里。
  if (it.scope === 'global') return;
  if (!TODO_BY_NAME.has(it.name)) TODO_BY_NAME.set(it.name, []);
  TODO_BY_NAME.get(it.name).push(it);
});
(ALERTS.recovered || []).forEach(r => {
  if (!RECOVERED_BY_NAME.has(r.name)) RECOVERED_BY_NAME.set(r.name, []);
  RECOVERED_BY_NAME.get(r.name).push(r);
});
/* 判不了是按规则给的（一条规则缺历史，缺的是它跑的那一批类别），这里翻成按类别——
   页面是按类别组织的，读的人问的是「这一类今天判得了吗」。同一个类别可以同时落在
   几条判不了的规则里，所以存成数组。 */
(ALERTS.insufficient || []).forEach(r => {
  (r.names || []).forEach(n => {
    if (!INSUFF_BY_NAME.has(n)) INSUFF_BY_NAME.set(n, []);
    INSUFF_BY_NAME.get(n).push(r);
  });
});

/* 一条命中的三行。标题行里 Rule ID 与规则名并列：ID 是去规则表里查判据的钥匙，
   折叠态下就得看得见。（2026-10-13 前这里还挂着一枚 P 徽标——P 现在只属于类别，
   规则不再带档，见 monitor.py 的 LEVEL_BY_SEGMENT。） */
const ruleRow = x => `<div class="rrow">
  <div class="rhd">
    <span class="rid">${esc(x.ruleId)}</span>
    <span class="rt">${esc(tx(x.ruleTitle))}</span>
  </div>
  <div class="arow"><span class="k">${esc(L('判据', 'Condition'))}</span>
    <span class="v">${esc(tx(x.trigger))}</span></div>
  <div class="arow"><span class="k">${esc(L('连续', 'Streak'))}</span><span class="v">${x.kind === 'alert'
    ? (x.consecutiveDays > 1
      // 英文的 day/days 得数着来：consecutiveDays 真会等于 1（只成立当天），
      // 「1 consecutive days」是错的（中文「1 天」没这个问题）。
      ? L(`自 <b>${esc(x.streakDates[0])}</b> 起连续 <b>${x.consecutiveDays}</b> 天成立`,
          `held for <b>${x.consecutiveDays}</b> consecutive day${x.consecutiveDays > 1 ? 's' : ''} since <b>${esc(x.streakDates[0])}</b>`)
      : esc(L('本期第一次成立', 'first hit this period')))
    : `<span class="tnote">${esc(L('当期快照规则，没有连续天数要求', 'snapshot rule — no consecutive-day requirement'))}</span>`}</span></div>
  <div class="arow"><span class="k">${esc(L('触发', 'Triggered'))}</span><span class="v">
    <b>${esc(x.sourceDate)}</b>${x.firstTriggerDate !== x.sourceDate
      ? `<span class="tnote">${esc(L('首次', 'first'))} ${esc(x.firstTriggerDate)}</span>`
      : `<span class="tnote">${esc(L('首次触发', 'first trigger'))}</span>`}</span></div>
</div>`;

/* 规则配置表：卡片上写着 Rule ID，判据得在同一屏里查得到。它排在类别列表头上，
   没有预警时也照旧在——它是判据本身，不随当天的命中结果出现或消失。
   （2026-10-14 前这里还挂着「全局规则命中」一块，随整块下钻表一起去掉了：
   「整体数低在哪几类」改由 ② 的排序档回答。2026-10-16 为 RULE_004 又挂回过一天
   ——只留命中行、没有下钻表——当天随那条规则一起删掉：整体指标命中在这儿回答不了
   「是哪几类」，排序档才是答案。） */
sec('ruleBox', () => {
  el('ruleBox').innerHTML = ruleCardHTML();
});

/* 两种中间状态，跟着预警一起落在类别自己的折叠里。它们不是预警，但也不能省：
   「已恢复」是「上次报的那条好了」，不说的话读的人会以为它凭空消失了；
   「判不了」是「这条规则今天根本没法判」——页面上最危险的一种空白，
   不说的话「缺历史」和「一切正常」在页面上是同一种空白。
   这里原来还有第三种「接近触发」（今天成立、期数还不够）。2026-10-10 撤掉：
   它列的是「还没报警的事」，看板每天要扫的是「今天有哪些事要动手」，
   差几天的进度既不用动手、也不影响结论，只把列表拉长。
   载荷里的 A.watching 照旧算、照旧进 output/，撤的只是这一处展示。 */
const noteRecovered = r => `<div class="cnote">${esc(L('本期已恢复：', 'Recovered this period: '))}<span class="rid">${esc(r.ruleId)}</span>
  ${esc(tx(r.ruleTitle))}${esc(L(
    `——上一期（${esc(r.lastDate)}）还连续成立 ${r.hadDays} 天，本期不再成立。事项不会因此消失，指标恢复不等于这件事处理完了。`,
    ` — it still held for ${r.hadDays} consecutive day${r.hadDays > 1 ? 's' : ''} on ${esc(r.lastDate)} and no longer holds this period. The task does not disappear: a recovered metric does not mean the work is done.`))}</div>`;
const noteInsufficient = r => `<div class="cnote warn">${esc(L('判不了：', 'Cannot be judged: '))}<span class="rid">${esc(r.ruleId)}</span>
  ${esc(tx(r.ruleTitle))}${esc(L(
    `——${esc(tx(r.reason))}。缺的是历史，攒够期数自动开始判；这一条既不算正常也不算异常。`,
    ` — ${esc(tx(r.reason))}. What is missing is history; it starts being judged automatically once enough periods accumulate. This row counts as neither normal nor abnormal.`))}</div>`;

/* ── 每类底下的问题诊断（差异构成）────────────────────────
   原来的 ④ 独立一节：类别 → 差异类型 → 差异流向 → 样本交易，全部 36 个类别都在。
   2026-10-12 并进 ② 每一块底下的折叠（用户定）：这一层回答的是「差异具体落在哪」，
   而问出这个问题的动作就是「② 里这一类看着不对」——拆成两节，读的人得在两处
   之间来回对照。
   每一层的笔数相加都严格等于上一层：类型这一级是先切类型、再在类型里切流向，
   不是把流向合起来再按主导类型归类——后者点开看到的是另一个数。
   商户 / 机构 / 规律 / 规则 / 知识库这些层没有数据源，不编。
   2026-11-13 用户定：页面不再内嵌逐笔交易示例。流向行只保留笔数 / 金额，
   类型行仍可展开看流向构成；漏识别 / 多识别没有流向层，直接作为一行显示。
   整棵树包进 try/catch（见 diagTree）：它跟着 ② 一次性铺 36 份，
   一处抛错不能把趋势图、目录、排序一起带走。 */

/* 漏识别 / 多识别两个类型**不渲染流向这一层**（2026-10-13 用户定）：这两个类型下
   恒为「类别名 → (空)」/「(空) → 类别名」一条流向（monitor.py 的 is_empty 把 (空)
   当空值），标签只是把类别名抄了一遍，点开等于白点一次。判据用类型 key，不看 flows
   有几条——按数量合的话，分类不一致哪天只剩一条流向会被悄悄改形状。key 与
   monitor.py 的 MISMATCH_TYPES 对应（同 ENUMS 的规矩，这是第二份拷贝）。 */
const LEAF_TYPES = { miss: 1, extra: 1 };

/* 流向行：静态一行，点不开，也没有逐笔样本。层级用缩进和竖线表达，不靠字号递减。 */
const flowRow = (f, color) => `<div class="flowrow">
  <div class="fname">
    <span class="sw" style="background:${color}"></span>
    <span class="tx">${esc(catTxt(f.from))} <span style="color:var(--ink-3)">→</span> ${esc(catTxt(f.to))}</span>
  </div>
  <div class="cn">${i(f.count)}${esc(L(' 笔', ' rows'))}</div>
  <div class="am">${money(f.amount)}</div>
</div>`;

/* 一个类别的诊断树（类别 → 差异类型 → [分类不一致再分流向]）。
   没有差异记录的类别照样给一句「本期没有差异记录」——从页面上悄悄消失，读起来就
   变成「这个类别没问题」，而它其实只是没数据。
   整棵树包在 try 里：它跟着 ② 一次性铺 36 份，一处抛错不能把趋势图、目录、排序
   一起带走（一个坏 key 让整段脚本打住，是这一页踩过的坑）。哪一类渲染失败就写在
   哪一类的折叠里，看得见，也找得到是谁。 */
function diagTree(c) {
  try { return diagTreeHTML(c); } catch (e) {
    console.error(`[bscat] 类别「${c.name}」的诊断明细渲染失败`, e);
    return `<div class="hint">${esc(L('这一类别的诊断明细渲染失败：', 'Failed to render the diagnosis detail for this category: '))}${esc(e.message)}</div>`;
  }
}
function diagTreeHTML(c) {
  const d = (DATA.catDetails || {})[c.name];
  if (!d || !d.count) return `<div class="hint">${esc(L('本期没有差异记录。', 'No difference records this period.'))}</div>`;
  return d.types.map(ty => {
    const tt = typeOf(ty.key);
    const flows = ty.flows || [];
    const cells = `
          <div class="tname"><span class="sw" style="background:${tt.color}"></span>
            <span class="tx">${esc(tx(tt.label))}</span>${ecTag(tt.enum)}</div>
          <div class="cn">${i(ty.count)}${esc(L(' 笔', ' rows'))}</div>
          <div class="pc">${esc(L('占 ', 'share '))}${pct(ty.count / d.count)}</div>
          <div class="am">${money(flows.reduce((a, f) => a + f.amount, 0))}</div>`;
    // 漏识别 / 多识别没有流向层，直接作为一行显示；不再有逐笔样本可点开。
    if (LEAF_TYPES[ty.key]) {
      return `<div class="dtype leaf">${cells}</div>`;
    }
    return `<details class="dtype"><summary>${cells}<div class="ar">▶</div></summary>
        <div class="dtbody">${flows.map(f => flowRow(f, tt.color)).join('')}</div>
      </details>`;
  }).join('')
  + (d.unlabeled ? `<div class="hint">${esc(L(
      `另有 ${i(d.unlabeled)} 笔未标注差异类型，未并入任何一类`,
      `${i(d.unlabeled)} more rows have no difference type and are not folded into any bucket`))}</div>` : '');
}

/* 类别 → 一个类别块底下那两条折叠。折叠态各占一行，左边那句先说清「里面有什么」：
     风险预警 —— 命中几条规则 / 本期未触发，夹着「判不了 / 已恢复」两枚标记；
     差异构成 —— 这一期有没有差异、能不能按类型 / 流向拆开。
   扫 36 块时靠这两行的明暗就知道该停在哪几块上。
   默认都收起：36 个类别、每类几千笔差异，摊开谁也读不动。
   2026-10-13 拆成两条（用户定）——「今天犯了哪几条规则」与「差异落在哪」是两个
   问题，合成一条时点开「只看规则」也会连带把整棵树铺出来。 */
function moreHtml(c) {
  const name = c.name;
  const rows = TODO_BY_NAME.get(name) || [];
  const rec = RECOVERED_BY_NAME.get(name) || [];
  const ins = INSUFF_BY_NAME.get(name) || [];
  const d = (DATA.catDetails || {})[name];
  const hint = (!d || !d.count)
    ? L('本期无差异明细', 'No difference detail this period')
    : L('按类型 / 流向查看', 'by type / flow');

  const facts = rows.length
    ? `<div class="cmsec">${esc(L('命中的规则', 'Rules hit'))}</div>
       <div class="rlist">${rows.map(ruleRow).join('')}</div>`
    : `<div class="cmsec">${esc(L('命中的规则', 'Rules hit'))}<span class="cn">${esc(L('本期未触发', 'not triggered this period'))}</span></div>
       <div class="hint">${esc(L(
         `本期没有规则成立${ins.length ? '；判不了的那条列在下面' : ''}。`,
         `No rule holds this period${ins.length ? '; the one that could not be judged is listed below' : ''}.`))}</div>`;

  return `<details class="cmore cwarn" data-cat="${esc(name)}" data-kind="warn">
    <summary>
      <span class="cmt${rows.length ? '' : ' na'}">${esc(L('风险预警', 'Risk alerts'))}${rows.length
        ? esc(L(` · ${rows.length} 条`, ` · ${rows.length} hit`)) : esc(L(' · 本期未触发', ' · not triggered this period'))}</span>
      ${ins.length ? `<span class="cmk w">${esc(L('判不了', 'cannot tell'))}</span>` : ''}
      ${rec.length ? `<span class="cmk">${esc(L(`已恢复 ${rec.length}`, `${rec.length} recovered`))}</span>` : ''}
      <span class="par">▶</span>
    </summary>
    <div class="cmbody">
      ${facts}
      ${ins.map(noteInsufficient).join('')}
      ${rec.map(noteRecovered).join('')}
    </div>
  </details>
  <details class="cmore cwdet" data-cat="${esc(name)}" data-kind="det">
    <summary>
      <span class="cmt na">${esc(L('差异构成', 'Difference breakdown'))}</span>
      <span class="cmq">${esc(hint)}</span>
      <span class="par">▶</span>
    </summary>
    <div class="cmbody">
      ${diagTree(c)}
    </div>
  </details>`;
}

/* ── ② 36 个类别指标趋势 ─────────────────────────────────
   一类一块，每块三张图：覆盖率（两侧各一条） / 一致率（并集口径） / 差异（笔数 + 金额）。
   四条曲线的数据全部来自载荷里的 catSeries——脚本在生成阶段就把「每类每天一行」
   的历史铺成了「日期轴 × 每类每列一条同长数组」的矩阵，页面按类取名直接画，
   不再按 36 个类别各读一遍历史、各聚合一遍。日期范围一改，重画读的是同一份矩阵，
   Python 侧一次铺平换来的是这里 108 张图共用一个数据源。

   三条明确的红线（都不做）：
     · 只放 Top N —— 「哪几个类别在变坏」会变成一个要看运气的问题
     · 默认折叠、点开才出 —— 同上，而且折叠状态本身就是一种隐藏
     · 下拉框一次只看一类 —— 那样永远无法横向比较
   36 块一个不少，目录条目与区块一一对应。

   默认档是「按 P0/P1/P2」（DEF_SORT = 'pri'，同档内按差异笔数降序）：这一段要回答
   的是「哪几类今天要动手」，字母序会正好把它摊平。**不按业务板块分段**（2026-10-13
   用户定）：36 类排成一条清单，点哪一档就按哪个条件排，板块那一层横在中间等于
   给排序加了个它管不着的上限。排序改的是**同一批 DOM 节点的先后**（appendChild
   搬现有节点，不重建），所以已经建好的图、锚点、两个观察器全都活着。正文左边那列
   类别目录读的是同一份次序——两处各排各的，同一个类别在一处排第一、在另一处排
   第三，读的人会以为漏看了什么。

   懒渲染只影响「什么时候建 DOM」，不影响「建不建」：滚动到附近就建，
   不需要任何点击，类别也不会因为没滚动到而缺失。 */
/* ── 左侧一级目录 ──────────────────────────────────────────
   条目从页面自己的 .part 标题里读，不在这里再抄一份：加一节、改一节标题，目录
   跟着变，不存在「标题改了目录还是旧的」这种中间态。标题里的括注说的是这一节
   收着什么东西，目录一栏放不下，去掉括注部分。

   2026-10-13 到 10-16 之间 ② 底下还挂着第二层：逐个类别。2026-10-16 用户定
   撤掉——一级目录只回答「这一页有哪几节」，类别归 ② 正文里那列「类别目录」管
   （那一列任何宽度都在，这一栏窄屏整个不显示）。

   点击一律走委托：条目是渲染出来的，逐条绑监听迟早漏一条。 */
sec('toc', () => {
  const parts = [...document.querySelectorAll('.part')];
  if (!parts.length) return;
  const nav = el('toc');
  nav.innerHTML = `<div class="thd">${esc(L('目录', 'Contents'))}</div>` + parts.map(p => {
    const n = p.querySelector('.pnum').textContent.trim();
    const t = p.querySelector('.pttl').textContent.trim().split(/[（(]/)[0];
    return `<button class="tci" data-part="${esc(p.id)}">`
      + `<span class="tno">${esc(n)}</span>${esc(t)}</button>`;
  }).join('');

  const mark = id => nav.querySelectorAll('button.tci').forEach(b =>
    b.classList.toggle('on', b.dataset.part === id));

  /* 判定带与 ② 的类别目录同一套，理由也一样：视口上沿收 12%、下沿收 76%，
     带里通常只落得下一段，跨段那一瞬间两条同时命中，后到的那条赢。用观察器
     而不是 scroll 事件，同样是省掉每滚一像素一次同步布局。 */
  const spy = new IntersectionObserver(es => {
    es.forEach(e => { if (e.isIntersecting) mark(e.target.id); });
  }, { rootMargin: '-12% 0px -76% 0px' });
  parts.forEach(p => spy.observe(p));

  nav.addEventListener('click', ev => {
    const b = ev.target.closest('button.tci');
    if (!b) return;
    const node = document.getElementById(b.dataset.part);
    if (!node) return;
    // 先点亮再滚：平滑滚动要几百毫秒，干等观察器回调，看着就是点了没反应
    mark(b.dataset.part);
    node.scrollIntoView({ behavior: 'smooth', block: 'start' });
  });
});

sec('catTrends', () => {
  const rows = DATA.categories || [];
  if (!rows.length) {
    el('catBlocks').innerHTML = `<div class="empty">${esc(L('没有类别数据。', 'No category data.'))}</div>`;
    // 控件与目录跟着空数据一起清掉，别留一条空控件和一个空框
    el('catSort').innerHTML = '';
    el('catNav').innerHTML = '';
    return;
  }
  const CS = DATA.catSeries || { dates: [], series: {} };
  // 只画到这一屏的监控日为止：回溯到 8 月那一屏上画出 9 月的线，等于把还没发生的事
  // 摆进图里。序列本身是全历史一份，这里按下标裁一刀，不复制任何一列。
  const dates = (CS.dates || []).filter(d => !DATA.dataDate || d <= DATA.dataDate);
  const ser = name => CS.series[name] || {};

  /* 每块三张图，一张画一个口径。差异笔数与差异金额和 ① 一样合成一图两轴
     （用户 2026-10-10 定）：分成两张时它们本来就在不同行，要对着看只能上下瞟。
     迷你图放得下双轴，是因为它不画端点直标——右边只需要让出一根轴的刻度宽度
     （r: 66），不必像 ① 那样留 132。 */
  const MINI = [
    { key: 'cov', unit: 'rate', series: [
        { key: 'finv_coverage',   name: 'bscat',  color: 'var(--s-finv)' },
        { key: 'illion_coverage', name: 'illion', color: 'var(--s-illion)' }] },
    // 一致率这一格与 ① 同步（用户 2026-10-10）：名字带上口径。
    // 只画并集口径这一条——逐类没有「全量样本」那一路可画：那个分母是整批交易，
    // 逐类除出来约等于该类自己的规模，比出来的是类别大小，不是模型好坏。
    { key: 'iou', unit: 'rate', series: [
        { key: 'iou_rate', name: L('一致率（并集口径）', 'Agreement (union)'), color: 'var(--s-agree)' }] },
    /* 第三格 2026-10-15 改版（用户定）：两条折线 → 100% 堆积柱。段 = 一致 + 分类不一致 +
       漏识别 + 多识别，四项恒等于本类并集，也就是那个恒等式本身。多期照旧保留，
       读的是构成怎么变：底下一致那一截在缩、顶上哪一段在涨，一眼对得上。
       两个率各自的走势仍在 ① 那张图上，这一格不再重复它们的形状。 */
    { key: 'mix', unit: 'rate', stack: true, mean: false, series: [
        { key: 'agree_rate', name: L('一致',       'Agree'),    color: 'var(--s-agree)' },
        { key: 'mix_rate',   name: L('分类不一致', 'Mismatch'), color: 'var(--m-diff)' },
        { key: 'miss_rate',  name: L('漏识别',     'Missed'),   color: 'var(--m-miss)' },
        { key: 'extra_rate', name: L('多识别',     'Extra'),    color: 'var(--m-extra)' }] },
    { key: 'cnt', unit: 'count', unit2: 'money', zero: true, r: 66,
      series:  [{ key: 'diff_count',  name: L('差异笔数', 'Differences'), color: 'var(--s-diffc)' }],
      series2: [{ key: 'diff_amount', name: L('差异金额', 'Difference amount'), color: 'var(--s-diffa)' }] },
  ];
  /* 每格小标题。原来是「标题 + 悬停说明」两元组，说明那一半 2026-10-14 起不再展示
     （正文里的解释性文字一律不摆），只剩标题——形状跟着收成一层映射。
     键必须与 MINI 的 key 一一对应：取不到就是 undefined 印进页面，不是报错。 */
  const MT = {
    cov: L('覆盖率', 'Coverage'),
    iou: L('一致率（并集口径）', 'Agreement (union)'),
    mix: L('结构（并集 100%）', 'Mix (union, 100%)'),
    cnt: L('差异', 'Differences'),
  };
  // Δ 显示：取不到就是「—」，不是 0——0 会被读成「没有变化」，而「—」是「还没测到」。
  // 四舍五入到两位后等于 0 的，去掉正负号：浮点误差会让实际没变的那个数显示成
  // 「−0.00」，那个负号会让人去找一个根本不存在的变化。
  const dpt = (v, color) => {
    if (v == null) return '—';
    const n = v * 100;
    if (Math.abs(n) < 0.005) return '0.00';     // 显示精度以下一律当作持平
    const c = color ? ` style="color:${n > 0 ? 'var(--agree-ink)' : 'var(--st-crit-ink)'}"` : '';
    return `<span${c}>${n > 0 ? '+' : '−'}${Math.abs(n).toFixed(2)}</span>`;
  };

  /* 类别 P 档由服务端定死（monitor.py 的 LEVEL_BY_SEGMENT：P0 = 收入类 + 贷款类
     两个板块的全体成员，P1 = Rent / Gambling，P2 = 其余），页面只读不判。排序档
     与两处目录的点色都从这一份映射取，三处共用——徽标、排序、点色说的是同一件事，
     各写各的映射迟早会出现「排在前面的徽标是灰的」。 */
  const LEVEL_RANK = { P0: 0, P1: 1, P2: 2 };
  const LVL_DOT = { P0: 'var(--p0)', P1: 'var(--p1)', P2: 'var(--ink-3)' };

  // 块头那一行已经给了本期的四个数（取 DATA.categories，与 ① 的合计同源），
  // 图上就不必再标一次端点值——重复标一遍只会把迷你图挤窄。
  // 一致率后面那枚 Δ 是 2026-10-12 补的：原来它只长在 36 行总表的「一致率 Δ」列上，
  // 总表撤掉后，页面上唯一按它排序的那一档（「变化最大」）就没有对得上的数了。
  const blkHead = c => {
    const lvl = c.level;
    const num = v => v == null ? '—' : pct(v);
    return `<div class="cbhd">
      <span class="cbn">${esc(c.name)}</span>
      ${lvl ? `<span class="pri ${lvl}">${lvl}</span>` : ''}
      <span style="flex:1"></span>
      <span class="cbx">
        ${esc(L('一致率', 'Agreement'))} <b>${num(c.iou_rate)}</b>${c.d_iou == null ? ''
          : `<span class="dl">${dpt(c.d_iou, true)}</span>`}
        · ${esc(L('bscat 覆盖', 'bscat coverage'))} <b>${num(c.finv_coverage)}</b>
        · ${esc(L('差异', 'differences'))} <b>${c.diff_count == null ? '—' : i(c.diff_count)}</b>${L(' 笔', '')}
        · <b>${c.diff_amount == null ? '—' : money(c.diff_amount)}</b></span>
    </div>`;
  };

  CAT_ANCHOR.clear();
  rows.forEach((c, n) => CAT_ANCHOR.set(c.name, 'cat-' + n));

  /* 排序八档，比较的都是行本身。次序改的是同一批节点的先后（见 applySort）。
     默认档是「按 P0/P1/P2」——P 档由服务端定（见上面的 LEVEL_RANK），同档内按
     差异笔数降序，于是「先看哪几类」这件事在页面上有唯一一个答案。
     「一致率缺口最大 / 漏判最多 / 多判最多」这三档回答的是「整体的那几个数为什么低」：
     把整体缺口摊到各类，每类的份额就是该类的差异 / 漏判 / 多判笔数（分母对每一类
     都是同一个整体分母），所以按笔数排就是按影响排——整体一致率低看第一档。
     「覆盖差 · bscat 低 / 高」两档回答的是覆盖率那个数：排的是 (bscat 判出 − illion
     判出) ÷ 全量样本，分母同样对每一类都一样，所以按差值排 = 按对整体差值的贡献排。
     方向固定、一档一个方向：低的那档把最负的排最前，高的那档把最正的排最前。
     **别拿漏判/多判两档代替它俩**：那两档排的是「一侧有、另一侧没有」的两笔粗量，
     覆盖差是两者的净差。2026-10-08 实测，与覆盖差最低前十只重合 4/10 与 2/10；
     All Other Credits 漏判 20,420 笔排第 2、多判 16,757 笔排第 1，净差却是 +0.10 pt。
     「变化最大」按 |Δ一致率| 降序——这一档要的是「今天动得最厉害的那几类排最前面」，
     涨还是跌都值得看，所以取绝对值；上一期缺值时没有可比的变化，该档禁用。
     这几档都是排序，不是新算的一份数。 */
  const SORTS = {
    pri:   { label: L('按 P0/P1/P2', 'By P0/P1/P2'), cmp: (a, b) => (LEVEL_RANK[a.level] - LEVEL_RANK[b.level]) || (b.diff_count - a.diff_count) },
    diff:  { label: L('一致率缺口最大', 'Largest agreement gap'), cmp: (a, b) => (b.diff_count || 0) - (a.diff_count || 0) },
    miss:  { label: L('漏判最多', 'Most missed'), cmp: (a, b) => (b.miss_count || 0) - (a.miss_count || 0) },
    extra: { label: L('多判最多', 'Most extra'), cmp: (a, b) => (b.extra_count || 0) - (a.extra_count || 0) },
    gapLow:  { label: L('覆盖差 · bscat 低', 'Coverage gap · bscat low'), cmp: (a, b) => (a.coverage_gap || 0) - (b.coverage_gap || 0) },
    gapHigh: { label: L('覆盖差 · bscat 高', 'Coverage gap · bscat high'), cmp: (a, b) => (b.coverage_gap || 0) - (a.coverage_gap || 0) },
    chg:   { label: L('变化最大', 'Largest change'), cmp: (a, b) => Math.abs(b.d_iou || 0) - Math.abs(a.d_iou || 0), needHist: true },
    name:  { label: L('类别名称', 'Category name'), cmp: (a, b) => a.name.localeCompare(b.name) },
  };
  const DEF_SORT = 'pri';
  const hasDelta = rows.some(c => c.d_iou != null || c.d_finv_coverage != null);
  let sortMode = DEF_SORT;
  const order = () => rows.map((_, n) => n).sort((a, b) => SORTS[sortMode].cmp(rows[a], rows[b]));

  /* ── 一条平铺的清单 ─────────────────────────────────────
     2026-10-13 用户定：**不按业务板块分段**，按排序档把 36 类排成一条清单。
     上一版先按板块切开、档只改组内先后，用下来要的是「点哪一档就按哪个条件排」，
     板块那一层横在中间等于给排序加了个它管不着的上限。
     载荷里的 DATA.segments 与每类的 group 还在（脚本自检要求每类恰好属一个板块，
     那对数据质量有用），页面这一侧不再读它。 */
  const blkHtml = (c, n) => `
    <div class="catblk" id="cat-${n}" data-cat="${esc(c.name)}">
      ${blkHead(c)}
      <div class="cbgrid">
        ${MINI.map(m => `<div class="cbcell">
          <div class="cbt"><b>${esc(MT[m.key])}</b>
            <span class="legend">${m.series.concat(m.series2 || []).map(s =>
              `<span class="lg"><span class="sw" style="background:${s.color}"></span>${esc(s.name)}</span>`).join('')}`
            + (m.mean === false ? '' : `<span class="lg"><span class="sw dash"></span>${esc(L('均值', 'average'))}</span>`)
            + `</span>
          </div>
          <div class="chartwrap" id="cwr-${n}-${m.key}">
            <svg class="mini" id="csv-${n}-${m.key}"></svg>
            <div class="tipbox small" id="ctp-${n}-${m.key}"></div>
          </div>
        </div>`).join('')}
      </div>
      ${moreHtml(c)}
    </div>`;

  // 正文：一类一块，一条清单铺到底，次序由排序档定（见 applySort）
  el('catBlocks').innerHTML = rows.map((c, n) => blkHtml(c, n)).join('');

  // 目录：36 条对 36 块（data-blk 直接指向块的 id），一条清单，P 档靠色点给
  const navItem = n => {
    const c = rows[n], lvl = c.level;
    return `<button class="cni" data-cat="${esc(c.name)}" data-blk="cat-${n}">`
      + `${esc(c.name)}${lvl ? `<span class="ndot" style="background:${LVL_DOT[lvl]}"></span>` : ''}</button>`;
  };
  el('catNav').innerHTML = `<div class="nhd">${esc(L('类别目录', 'Categories'))}<span class="nc">${esc(L(`${rows.length} 类`, `${rows.length}`))}</span></div>`
    + rows.map((_, n) => navItem(n)).join('');

  /* 排序控件：容器只渲染一次、监听只绑一次——重排时只挪节点、只切 .on。
     每排一次都重渲染一遍按钮条的话，每渲染一次就得再绑一次监听，一次点击会被
     接上 N 次。
     「变化最大」在缺上一期时禁用，原来悬停上写着「需要历史数据」，2026-10-16 删了
     （用户定：悬停里也不放解释）。按钮自己那颗 disabled 也就是那句话。 */
  el('catSort').innerHTML = `<span class="sbl">${esc(L('排序', 'Sort'))}</span>`
    + Object.entries(SORTS).map(([k, s]) =>
      `<button class="sbtn" data-mode="${k}"${s.needHist && !hasDelta ? ' disabled' : ''}>${esc(s.label)}</button>`).join('')
    + `<button class="sbtn" id="catSortReset">${esc(L('重置', 'Reset'))}</button>`;

  /* 重排 = 把现有节点按次序搬一遍，**不重建 innerHTML**：已经建好的图、charts 里的
     实例、cat-${n} 锚点、懒渲染与滚动联动那两个观察器，全都还是原来那批。
     两处（正文 / 类别目录）读同一份次序，同一轮搬完。各排各的话，一处改了次序
     另一处不知道，目录就从「索引」变成了「另一份对不上号的清单」——那正是这节
     要避免的。 */
  const nav = el('catNav'), blocks = el('catBlocks');
  const navBtn = n => nav.querySelector(`button.cni[data-blk="cat-${n}"]`);
  function applySort() {
    order().forEach(n => {
      blocks.appendChild(el('cat-' + n));
      nav.appendChild(navBtn(n));
    });
    el('catSort').querySelectorAll('.sbtn[data-mode]').forEach(b =>
      b.classList.toggle('on', b.dataset.mode === sortMode));
  }
  el('catSort').addEventListener('click', ev => {
    const b = ev.target.closest('button.sbtn');
    if (!b) return;
    if (b.id === 'catSortReset') sortMode = DEF_SORT;
    else if (b.disabled) return;
    else sortMode = b.dataset.mode;
    applySort();
  });
  applySort();

  /* 懒渲染：滚动到附近才建图。**不改变「有没有」**——36 块全在 DOM 里，
     不需要点任何东西；只是把 108 张 SVG 的构建摊到滚动过程中，避免首屏卡住。
     建一次画一次：日期口径只有监控日期一个，控件撤掉之后不存在「重画一遍」
     这回事（原来范围一改要把所有已建过的块重画）。 */
  const charts = new Map();
  function paintOne(n) {
    const cs = charts.get(n);
    if (!cs) return;
    const s = ser(rows[n].name);
    /* 第 3 格那张堆积柱要的两段是派生的（见 MINI 里 mix 那项）：一致率直接取
       iou_rate，「分类不一致」用并集内剩下的那一份补出来。别拿序列里的 diff_rate
       去减：那一列是源表按**单侧归属**算的差异笔数 ÷ 本类并集，逐类减出来会偏小
       （差多少看类别，多的能差一半），只有整体口径下两者才恰好相等。
       四段里任何一个取不到就给 null：少一段的柱不是 100%，不该画。 */
    const seg = k => {
      const v = col => (s[col] && okv(s[col][k])) ? s[col][k] : null;
      const iou = v('iou_rate'), mr = v('miss_rate'), er = v('extra_rate');
      if (iou == null || mr == null || er == null)
        return { agree_rate: null, mix_rate: null };
      return { agree_rate: iou, mix_rate: Math.max(0, 1 - iou - mr - er) };
    };
    const rws = dates.map((d, k) => ({
      date: d,
      finv_coverage: s.finv_coverage ? s.finv_coverage[k] : null,
      illion_coverage: s.illion_coverage ? s.illion_coverage[k] : null,
      iou_rate: s.iou_rate ? s.iou_rate[k] : null,
      miss_rate: s.miss_rate ? s.miss_rate[k] : null,
      extra_rate: s.extra_rate ? s.extra_rate[k] : null,
      diff_count: s.diff_count ? s.diff_count[k] : null,
      diff_amount: s.diff_amount ? s.diff_amount[k] : null,
      ...seg(k),
    }));
    cs.forEach(ch => ch.render(rws));
  }
  function build(n) {
    if (charts.has(n)) return;
    const cs = MINI.map(m => makeChart({
      svg: el(`csv-${n}-${m.key}`), wrap: el(`cwr-${n}-${m.key}`), tip: el(`ctp-${n}-${m.key}`),
      W: 460, H: 132, M: { t: 12, r: m.r || 50, b: 24, l: 42 },
      unit: m.unit, unit2: m.unit2, zero: m.zero, stack: m.stack,
      series: m.series, series2: m.series2, mini: true, short: true,
    }));
    charts.set(n, cs);
    chartGroup(cs);
    paintOne(n);
  }
  const blanks = [...document.querySelectorAll('#catBlocks .catblk')];
  const lazy = new IntersectionObserver(es => {
    es.forEach(e => { if (e.isIntersecting) { build(Number(e.target.id.slice(4))); lazy.unobserve(e.target); } });
  }, { rootMargin: '600px 0px' });
  blanks.forEach(b => lazy.observe(b));

  /* 滚动联动：滚到哪一类，目录里那一条就点亮。
     用 IntersectionObserver 而不是 scroll 事件：scroll 里读位置会强制同步布局，
     每滚一像素触发一次；这里只在跨越判定带时回调。
     判定带取视口上沿往里收 12%、下沿往里收 76%——带里通常只落得下一块，
     跨块的那一瞬间才会同时命中两条，后到的那条赢。 */
  const spy = new IntersectionObserver(es => {
    es.forEach(e => { if (e.isIntersecting) mark(Number(e.target.id.slice(4))); });
  }, { rootMargin: '-12% 0px -76% 0px' });
  blanks.forEach(b => spy.observe(b));
  function mark(n) {
    nav.querySelectorAll('button.cni').forEach(b =>
      b.classList.toggle('on', b.dataset.blk === 'cat-' + n));
    const cur = nav.querySelector('button.cni.on');
    // 目录自己也得滚：36 条在窄一点的屏幕上超出一屏，点亮的那个可能在可视区外
    if (cur) cur.scrollIntoView({ block: 'nearest' });
  }
  nav.addEventListener('click', ev => {
    const b = ev.target.closest('button.cni');
    // 先点亮再跳：跨十几块跳过去时，滚动联动的判定带要等滚完才会命中，
    // 中间那一下目录上亮着的还是出发的那一类。
    if (b) { mark(Number(b.dataset.blk.slice(4))); jumpToCat(b.dataset.cat); }
  });

  // 首屏那一块不等观察器：观察器要等一次布局才回调，而第一屏是打开就看的地方。
  // blanks 是在初次排完序之后取的，顺序就是视觉顺序，所以头一块是真的第一块。
  if (blanks.length) build(Number(blanks[0].id.slice(4)));

  /* ② 那一行摘要：类别数、图上有几期、三个 P 档各几类，再加上原来印在 ③ 头上的
     那句预警合计（触发几条规则、涉及几个类别），以及「已恢复 / 判不了」两个数——
     它们的明细现在都折在各自类别块底下，摘要是它们唯一露在外面的地方，少了这一句，
     那 36 块折叠起来就再也没人知道有东西被折进去了。P 档那几个数从行本身数——
     和徽标、排序、点色同一个来源（c.level），不另算一份。 */
  // 全局命中不在 TODO_BY_NAME 里（它不属于任何类别块），但「当前无触发预警」这句
  // 不能漏掉它——只有整体规则命中时，① 有角标而 ② 说无事，两处会打架。
  const nGlobalHit = (DATA.todo.items || []).filter(it => it.scope === 'global').length;
  const nHit = [...TODO_BY_NAME.values()].reduce((a, r) => a + r.length, 0) + nGlobalHit;
  const nLvl = { P0: 0, P1: 0, P2: 0 };
  rows.forEach(c => { if (nLvl[c.level] !== undefined) nLvl[c.level]++; });
  const nRec = (ALERTS.recovered || []).length;
  const nIns = (ALERTS.insufficient || []).length;
  // 「历史 N 期」整句翻，别只翻「历史」两个字再把「期」丢掉：英文那边会变成
  // 「history 18」，读起来像少了半句。
  el('p2Sum').innerHTML = `${esc(L(`${rows.length} 个类别`, `${rows.length} categories`))} · `
    + L(`历史 <b>${i(dates.length)}</b> 期`, `<b>${i(dates.length)}</b> periods of history`)
    + ` · P0 <b>${i(nLvl.P0)}</b> / P1 <b>${i(nLvl.P1)}</b> / P2 <b>${i(nLvl.P2)}</b>`
    + (nHit ? L(` · 触发 <b>${nHit}</b> 条规则`, ` · <b>${nHit}</b> rule${nHit > 1 ? 's' : ''} hit`)
        : L(' · <b>当前无触发预警</b>', ' · <b>no alerts at present</b>'))
    + (nRec ? L(` · 已恢复 <b>${nRec}</b>`, ` · <b>${nRec}</b> recovered`) : '')
    + (nIns ? L(` · 判不了 <b>${nIns}</b> 条规则`,
        ` · <b>${nIns}</b> rule${nIns > 1 ? 's' : ''} undecidable`) : '');
  // 差异构成的口径说明留在每个类别块底下的折叠里（展开后按类型 / 流向逐层看）。
});

/* ── 通用表格视图 ─────────────────────────────────────── */
function buildTable(id, head, rows) {
  el(id).innerHTML = `<table class="data"><thead><tr>${head.map(h =>
    `<th>${esc(h)}</th>`).join('')}</tr></thead>
    <tbody>${rows.map(r => `<tr>${r.map(c => `<td>${esc(c)}</td>`).join('')}</tr>`).join('')}</tbody></table>`;
}
document.querySelectorAll('.tvlink').forEach(b => {
  b.dataset.label = b.textContent;
  b.addEventListener('click', () => {
    const on = el(b.dataset.tv).classList.toggle('on');
    b.textContent = on ? L('收起数据表', 'Hide data table') : b.dataset.label;
  });
});

/* ── 主题切换 ─────────────────────────────────────────── */

/* ── 日期条占了多高 ────────────────────────────────────────
   .part / .catblk 自己那 12px 的 scroll-margin-top 只管「别贴到视口最上沿」，而日期
   条常驻在顶上，跳过去的目标会被压在条底下。高度不能写死：窄屏折行、回溯时多一颗
   「回到最新」、字体回退都会变。量出来写进 --datebar-h，给 html 的
   scroll-padding-top 用（见 CSS）。窄屏的条是不粘顶的（@media 里 position: static），
   那时要归零，否则会白让出一整条的高度。
   放在这里、别的 sec 之后：#datePick 与回溯那颗按钮都填完再量，条子才是它最终的高度。 */
/* 日期条自己的事：量高度喂给 scroll-padding-top，并决定它还粘不粘顶。
   一行高约 52px，折行后 ≥90px——60px 这条线把两种情形分开，中间没有第三种形态。 */
sec('datebar', () => {
  const bar = el('dateBar');
  if (!bar) return;
  const ONE_ROW = 60;
  const pub = () => {
    // 先分类再读 computed：position 不参与这个元素的高度计算（sticky 与 static 的
    // 盒子一样大），所以挂类不会改高度，也就不会把 ResizeObserver 喂成死循环。
    bar.classList.toggle('wraprows', bar.offsetHeight > ONE_ROW);
    document.documentElement.style.setProperty('--datebar-h',
      (getComputedStyle(bar).position === 'sticky' ? bar.offsetHeight : 0) + 'px');
  };
  pub();
  // 折行会触发 ResizeObserver；粘不粘顶是媒体查询切的不一定触发，所以 resize 也挂一条
  if (window.ResizeObserver) new ResizeObserver(pub).observe(bar);
  window.addEventListener('resize', pub);
});

sec('theme', () => {
  const saved = localStorage.getItem('bscat-theme');
  if (saved) document.documentElement.dataset.theme = saved;
  el('themeBtn').addEventListener('click', () => {
    const cur = document.documentElement.dataset.theme;
    const next = cur === 'dark' ? 'light' : cur === 'light' ? '' : 'dark';
    if (next) { document.documentElement.dataset.theme = next; localStorage.setItem('bscat-theme', next); }
    else { delete document.documentElement.dataset.theme; localStorage.removeItem('bscat-theme'); }
  });

  /* 语言按钮。字写的是**目标语言**——中文界面上写 English，英文界面上写「中文」，
     一眼看出点了会变成什么。与主题同一套做法：写状态 + 整页重载（理由见 LANG 那段）。
     重载前把 hash 里的 lang= 抹掉：那是一次性强制覆盖，留着会让这次点击看着没生效。
     hash 里其余部分（#date=）一个字都不动，所以切完语言还停在同一期。
     **不给它挂 title**：这颗按钮不解释任何东西（点了就换成那个语言），而 2026-10-16
     用户定的是悬停里不放解释——页面上现在一个非空 title 都没有。 */
  const lb = el('langBtn');
  lb.textContent = L('English', '中文');
  lb.addEventListener('click', () => {
    try { localStorage.setItem('bscat-lang', LANG === 'en' ? 'zh' : 'en'); } catch (e) { /* 存不下就只能靠 hash 了 */ }
    // 按参数拆开重建，不能直接删子串：hash 里可能还有 date=（分享出去的
    // 「英文版第 N 期」就是 #lang=en&date=…），删掉 lang=en 剩下的 "&date=…"
    // 拼回去没有 # 了，地址栏会变成一个不存在的路径，重载后整页空白。
    const rest = (location.hash || '').replace(/^#/, '').split('&')
      .filter(p => p && !/^lang=(en|zh)$/.test(p));
    const h = rest.length ? '#' + rest.join('&') : '';
    // 用 replaceState 而不是 location.hash = h：后者在 h 为空字符串时清不掉片段，
    // 地址栏里那个 lang=en 会活过一次重载，点一下看着像没生效。
    if (h !== location.hash) {
      try { history.replaceState(null, '', location.pathname + location.search + h); } catch (e) {}
    }
    location.reload();
  });
});

/* 有区块渲染失败时报警：空白的卡片必须解释自己为什么是空的 */
if (SEC_ERR.length) {
  const d = document.createElement('div');
  d.className = 'secfail';
  d.innerHTML = L(`<b>有 ${SEC_ERR.length} 个区块渲染失败</b>，对应内容为空，数据本身可能是好的：`,
      `<b>${SEC_ERR.length} section(s) failed to render</b> — their content is blank; the data itself may be fine:`)
    + SEC_ERR.map(e => `<div>· ${esc(e)}</div>`).join('');
  document.querySelector('.head').after(d);
}
</script>
